<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What You Shop</title>
<link rel="icon" href="favicon.png" type="image/png">
<meta name="description" content="Daily product picks from What You Shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #151a22;
    --muted: #5d6877;
    --line: #d9dfe6;
    --accent: #0a5cff;
    --tile: #dfe5ec;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --card: #1b212a;
      --ink: #eef1f5;
      --muted: #9aa5b4;
      --line: #2b3440;
      --accent: #5b9bff;
      --tile: #262e39;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
  }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 56px; }

  header { text-align: center; margin-bottom: 36px; }
  .avatar {
    width: 96px; height: 96px; border-radius: 22px;
    object-fit: cover; background: #fff;
    display: block; margin: 0 auto 14px;
  }
  h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .bio { color: var(--muted); margin: 0 auto; max-width: 42ch; }

  .day { margin: 0 0 36px; }
  .day h2 {
    font-size: 1.05rem; font-weight: 600; margin: 0 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 420px) { .grid { gap: 10px; } }

  .item {
    display: flex; flex-direction: column;
    background: var(--card); border-radius: 14px; overflow: hidden;
    color: inherit; text-decoration: none;
    border: 1px solid var(--line);
  }
  .item img, .item .ph {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    background: var(--tile);
  }
  .item span { padding: 12px 14px 14px; font-weight: 600; font-size: 0.95rem; }
  .item:hover { border-color: var(--accent); }
  .item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .note { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; max-width: 52ch; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" id="avatar" alt="" hidden>
    <h1 id="name">What You Shop</h1>
    <p class="bio" id="bio"></p>
  </header>
  <div id="list"><p class="note">Loading…</p></div>
  <footer id="disclosure"></footer>
</main>

<script>
// ====== SETTINGS: edit these once ======
var CONFIG = {
  name: "What You Shop",
  bio: "Fresh product picks every day. Tap one to see it on Amazon.",
  avatar: "images/logo.png",
  disclosure: "As an Amazon Associate I earn from qualifying purchases.",
  // Paste your Google Sheet "Publish to web" CSV link between the quotes.
  // Leave empty to use products.json instead.
  sheetCsvUrl: ""
};
// =======================================

(function () {
  var list = document.getElementById('list');

  function parseCSV(text) {
    var rows = [], row = [], cell = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function toISO(s) {
    s = (s || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var d = new Date(s);
    if (isNaN(d)) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function fromCSV(text) {
    var rows = parseCSV(text);
    var head = rows.shift().map(function (h) { return h.trim().toLowerCase(); });
    var ix = function (n) { return head.indexOf(n); };
    return rows.map(function (r) {
      return { date: toISO(r[ix('date')]), title: (r[ix('title')] || '').trim(),
               image: (r[ix('image')] || '').trim(), url: (r[ix('url')] || '').trim() };
    }).filter(function (p) { return p.date && p.title && p.url; });
  }

  function fmtDay(iso) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var d = new Date(iso + 'T00:00:00');
    var diff = Math.round((today - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function render(products) {
    document.getElementById('name').textContent = CONFIG.name;
    document.title = CONFIG.name;
    document.getElementById('bio').textContent = CONFIG.bio;
    document.getElementById('disclosure').textContent = CONFIG.disclosure;
    if (CONFIG.avatar) {
      var a = document.getElementById('avatar');
      a.src = CONFIG.avatar; a.hidden = false;
      a.onerror = function () { a.hidden = true; };
    }

    var items = products.slice().sort(function (x, y) {
      return x.date < y.date ? 1 : x.date > y.date ? -1 : 0;
    });
    if (!items.length) { list.innerHTML = '<p class="note">No picks yet. Check back soon.</p>'; return; }

    var groups = {}, order = [];
    items.forEach(function (it) {
      if (!groups[it.date]) { groups[it.date] = []; order.push(it.date); }
      groups[it.date].push(it);
    });

    list.innerHTML = '';
    order.forEach(function (date) {
      var sec = document.createElement('section');
      sec.className = 'day';
      var h = document.createElement('h2');
      h.textContent = fmtDay(date);
      var grid = document.createElement('div');
      grid.className = 'grid';
      groups[date].forEach(function (it) {
        var a = document.createElement('a');
        a.className = 'item';
        a.href = it.url;
        a.target = '_blank';
        a.rel = 'sponsored noopener noreferrer';
        var img = document.createElement('img');
        img.src = it.image; img.alt = ''; img.loading = 'lazy';
        img.onerror = function () {
          var ph = document.createElement('div'); ph.className = 'ph';
          img.replaceWith(ph);
        };
        var t = document.createElement('span');
        t.textContent = it.title;
        a.appendChild(img); a.appendChild(t);
        grid.appendChild(a);
      });
      sec.appendChild(h); sec.appendChild(grid);
      list.appendChild(sec);
    });
  }

  var load = CONFIG.sheetCsvUrl
    ? fetch(CONFIG.sheetCsvUrl).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(fromCSV)
    : fetch('products.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { return d.products || []; });

  load.then(render).catch(function () {
    list.innerHTML = '<p class="note">Couldn’t load products. Check the sheet link in index.html, or run a local server if you opened the file directly.</p>';
  });
})();
</script>
</body>
</html>
